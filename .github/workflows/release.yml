name: Release

# Tag-triggered, matching the Gitea CI convention (v* tags only, not every push).
# Complements .gitea/workflows/ci.yml's release-linux job with native macOS/Windows
# builds that Gitea's self-hosted Linux runner can't cross-compile reliably.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p zerotier-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="manytier-${version}-${{ matrix.target }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/manytier" "$out/"
          cp README.md LICENSE "$out/" 2>/dev/null || true
          tar czf "${out}.tar.gz" "$out"
          shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $out = "manytier-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/manytier.exe" -Destination $out
          Copy-Item README.md, LICENSE -Destination $out -ErrorAction SilentlyContinue
          Compress-Archive -Path $out -DestinationPath "$out.zip"
          Get-FileHash "$out.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $out.zip" } | Out-File -Encoding ascii "$out.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: manytier-${{ matrix.target }}
          path: |
            manytier-*.tar.gz
            manytier-*.tar.gz.sha256
            manytier-*.zip
            manytier-*.zip.sha256
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
