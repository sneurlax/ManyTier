name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  wasm-check:
    name: WASM Compilation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check zerotier-crypto (wasm32-unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown -p zerotier-crypto --no-default-features
      - name: Check zerotier-protocol (wasm32-unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown -p zerotier-protocol --no-default-features
      - name: Check zerotier-node (wasm32-unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown -p zerotier-node --no-default-features

  wasm-test:
    name: WASM Test (wasm-pack test --node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - name: Test zerotier-crypto (wasm-pack test --node)
        run: wasm-pack test --node crates/zerotier-crypto
      - name: Test zerotier-protocol (wasm-pack test --node)
        run: wasm-pack test --node crates/zerotier-protocol

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo audit
      - run: cargo deny check
      - run: cargo audit --file fuzz/Cargo.lock
      - run: (cd fuzz && cargo deny check)

  wasi-check:
    name: WASI Compilation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Check zerotier-crypto (wasm32-wasip1)
        run: cargo check --target wasm32-wasip1 -p zerotier-crypto --no-default-features
      - name: Check zerotier-protocol (wasm32-wasip1)
        run: cargo check --target wasm32-wasip1 -p zerotier-protocol --no-default-features
      - name: Check zerotier-node (wasm32-wasip1)
        run: cargo check --target wasm32-wasip1 -p zerotier-node --no-default-features

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t manytier:ci .
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name manytier-ci -v manytier-ci-data:/data manytier:ci \
            service --data-dir /data --controller-mode
          for _ in $(seq 1 20); do
            if docker exec manytier-ci manytier status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec manytier-ci manytier --version
          docker exec manytier-ci manytier status
          docker logs manytier-ci
      - name: Cleanup
        if: always()
        run: |
          docker rm -f manytier-ci 2>/dev/null || true
          docker volume rm manytier-ci-data 2>/dev/null || true
