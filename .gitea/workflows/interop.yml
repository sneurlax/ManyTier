name: Self-Hosted Interop Lane

# Manual-dispatch only. Runs host-mode on the Hetzner box (runner label
# zt-privileged) with /dev/net/tun,
# CAP_NET_ADMIN, and Docker. Following the house pattern for host-mode
# jobs, this uses the fixed checkout at /srv/manytier instead of
# actions/checkout (node-based actions are unreliable in host mode).
# Artifacts stay on the server under /srv/manytier/tests/shadow/artifacts/.
# The hosted-official lane is NOT run here by policy: it requires an
# interactive authorization checkpoint.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Which validation lane to run"
        required: true
        default: "privileged-docker"
        type: choice
        options:
          - privileged-docker
          - tool-parity
          - portable-refresh-m2o
          - portable-refresh-o2m

jobs:
  interop:
    name: Interop (${{ inputs.lane }})
    runs-on: zt-privileged
    timeout-minutes: 120
    steps:
      - name: Sync /srv/manytier to workflow commit
        run: |
          set -euo pipefail
          cd /srv/manytier
          git fetch origin
          git checkout --detach "$GITHUB_SHA"

      - name: Run lane
        run: |
          set -euo pipefail
          cd /srv/manytier
          export MANYTIER_ZEROTIER_ONE_BIN=/usr/sbin/zerotier-one
          case "${{ inputs.lane }}" in
            privileged-docker)
              ./tests/shadow/run-privileged-live-docker.sh
              ;;
            tool-parity)
              ./tests/shadow/run-self-hosted-tool-parity.sh
              ;;
            portable-refresh-m2o)
              MANYTIER_PORTABLE_REFRESH_ARTIFACT_ROOT=tests/shadow/artifacts/verify-28-01 \
              ./tests/shadow/run-portable-self-hosted-refresh.sh \
                --baseline-json tests/shadow/artifacts/verify-27-01-workstation/self-hosted-environment-report.json \
                --direction manytier-client-official-controller
              ;;
            portable-refresh-o2m)
              MANYTIER_PORTABLE_REFRESH_ARTIFACT_ROOT=tests/shadow/artifacts/verify-28-02 \
              ./tests/shadow/run-portable-self-hosted-refresh.sh \
                --baseline-json tests/shadow/artifacts/verify-27-01-workstation/self-hosted-environment-report.json \
                --direction official-client-manytier-controller
              ;;
          esac

      - name: List produced artifacts
        if: always()
        run: ls -la /srv/manytier/tests/shadow/artifacts/ || true
