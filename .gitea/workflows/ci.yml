name: CI

# Tag-triggered by design: this lane runs on release tags (v*), not on
# every push/merge. Use workflow_dispatch for an ad hoc run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  wasm-check:
    name: WASM Compilation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check zerotier-crypto (wasm32-unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown -p zerotier-crypto --no-default-features
      - name: Check zerotier-protocol (wasm32-unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown -p zerotier-protocol --no-default-features
      - name: Check zerotier-node (wasm32-unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown -p zerotier-node --no-default-features

  wasm-test:
    name: WASM Test (wasm-pack test --node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - name: Test zerotier-crypto (wasm-pack test --node)
        run: wasm-pack test --node crates/zerotier-crypto
      - name: Test zerotier-protocol (wasm-pack test --node)
        run: wasm-pack test --node crates/zerotier-protocol

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo audit
      - run: cargo deny check
      - run: cargo audit --file fuzz/Cargo.lock
      - run: (cd fuzz && cargo deny check)

  wasi-check:
    name: WASI Compilation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Check zerotier-crypto (wasm32-wasip1)
        run: cargo check --target wasm32-wasip1 -p zerotier-crypto --no-default-features
      - name: Check zerotier-protocol (wasm32-wasip1)
        run: cargo check --target wasm32-wasip1 -p zerotier-protocol --no-default-features
      - name: Check zerotier-node (wasm32-wasip1)
        run: cargo check --target wasm32-wasip1 -p zerotier-node --no-default-features

  release-linux:
    name: Release Binary (${{ matrix.target }})
    needs: [fmt, clippy, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        env:
          # Ubuntu's musl-tools package only ships an unprefixed `musl-gcc`,
          # not the `x86_64-linux-musl-gcc` name cc-rs looks for by default
          # (needed to cross-compile rusqlite's bundled sqlite3 C sources).
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p zerotier-cli
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="manytier-${version}-${{ matrix.target }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/manytier" "$out/"
          cp README.md LICENSE "$out/" 2>/dev/null || true
          tar czf "${out}.tar.gz" "$out"
          sha256sum "${out}.tar.gz" > "${out}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: manytier-${{ matrix.target }}
          path: |
            manytier-*.tar.gz
            manytier-*.tar.gz.sha256
          retention-days: 90
