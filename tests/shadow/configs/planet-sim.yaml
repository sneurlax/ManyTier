# Shadow planet simulation: 12-node topology (1 root + 1 controller + 10 peers).
#
# Topology:
# - Root provides VL1 peer discovery for all nodes
# - Controller uses the Controller engine (dynamic role) to serve NETWORK_CONFIG_REQUEST
# - 10 peers join the virtual network with pre-generated static configs
# - Peer pairs exchange ICMP echo (peer1<->peer2, peer3<->peer4, etc.)
#
# Shadow assigns IPs alphabetically by hostname:
#   controller=11.0.0.1, peer1=11.0.0.2, peer10=11.0.0.3, peer2=11.0.0.4,
#   peer3=11.0.0.5, peer4=11.0.0.6, peer5=11.0.0.7, peer6=11.0.0.8,
#   peer7=11.0.0.9, peer8=11.0.0.10, peer9=11.0.0.11, root=11.0.0.12
#
# Duration: 120s (enough for VL1 bootstrap + 10 peer config exchanges + VL2 ping)

general:
  stop_time: 120s
  model_unblocked_syscall_latency: true

network:
  graph:
    type: gml
    file:
      path: planet-sim.gml

hosts:
  root:
    network_node_id: 0
    bandwidth_down: "100 Mbit"
    bandwidth_up: "100 Mbit"
    processes:
    - path: ../../target/release/shadow-node
      args: "--role root --identity shadow-data/root.identity --port 9993"
      start_time: 0s
      expected_final_state: running
      environment:
        RUST_LOG: "info"

  controller:
    network_node_id: 1
    bandwidth_down: "100 Mbit"
    bandwidth_up: "100 Mbit"
    processes:
    - path: ../../target/release/shadow-node
      args: "--role controller --identity shadow-data/controller.identity --planet shadow-data/planet.bin --port 9993 --peer-count 10"
      start_time: 1s
      expected_final_state: running
      environment:
        RUST_LOG: "info"

  peer1:
    network_node_id: 2
    bandwidth_down: "50 Mbit"
    bandwidth_up: "50 Mbit"
    processes:
    - path: ../../target/release/shadow-node
      args: "--role vl2-peer --identity shadow-data/peer1.identity --planet shadow-data/planet.bin --port 9993 --network-config shadow-data/net-peer1.json --peer-ip 192.168.200.2"
      start_time: 3s
      expected_final_state: running
      environment:
        RUST_LOG: "info"

